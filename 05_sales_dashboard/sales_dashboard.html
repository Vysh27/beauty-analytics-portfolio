<style>

  button.reset:hover { background:var(--accent); color:#fff; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; }
  @media (max-width:640px){ .kpis{ grid-template-columns:repeat(2,1fr);} }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .kpi .lab { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .kpi .val { font-size:22px; font-weight:700; margin:6px 0 2px; }
  .kpi .delta { font-size:12px; font-weight:600; }
  .delta.pos { color:var(--pos);} .delta.neg { color:var(--neg);} .delta.flat{ color:var(--muted);}
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px; }
  @media (max-width:820px){ .grid2{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { font-size:14px; margin:0 0 14px; }
  .barrow { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:13px; }
  .barrow .name { width:120px; flex:none; color:var(--ink); }
  .barrow .track { flex:1; background:#f1ebee; border-radius:5px; height:16px; overflow:hidden; }
  .barrow .fill { height:100%; background:var(--accent); border-radius:5px; }
  .barrow .amt { width:84px; flex:none; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  svg { display:block; width:100%; height:auto; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:12px; color:var(--muted); }
  .legend span i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .foot { color:var(--muted); font-size:11px; margin-top:22px; text-align:center; }
  .empty { color:var(--muted); font-size:13px; padding:20px 0; text-align:center; }
</style>

const fmtINR = new Intl.NumberFormat('en-IN');
const money = v => '₹' + fmtINR.format(Math.round(v));
const baseDate = new Date(P.base + 'T00:00:00');
const addDays = n => { const d = new Date(baseDate); d.setDate(d.getDate()+n); return d; };
const iso = d => d.toISOString().slice(0,10);
const dayIndexFromISO = s => Math.round((new Date(s+'T00:00:00') - baseDate)/86400000);

// state
let fCats = new Set(P.cats.keys ? [...P.cats.keys()] : P.cats.map((_,i)=>i));
let fChans = new Set(P.chans.map((_,i)=>i));
let fromDi = 0, toDi = P.span - 1;

function buildControls(){
  document.getElementById('from').value = iso(addDays(0));
  document.getElementById('from').min = iso(addDays(0));
  document.getElementById('from').max = iso(addDays(P.span-1));
  document.getElementById('to').value = iso(addDays(P.span-1));
  document.getElementById('to').min = iso(addDays(0));
  document.getElementById('to').max = iso(addDays(P.span-1));
  const cb = document.getElementById('catBox');
  P.cats.forEach((c,i)=>{ cb.insertAdjacentHTML('beforeend',
    `<label class="chk"><input type="checkbox" data-cat="${i}" checked>${c}</label>`); });
  const hb = document.getElementById('chanBox');
  P.chans.forEach((c,i)=>{ hb.insertAdjacentHTML('beforeend',
    `<label class="chk"><input type="checkbox" data-chan="${i}" checked>${c}</label>`); });

  document.getElementById('from').addEventListener('change', e=>{ fromDi = dayIndexFromISO(e.target.value); render(); });
  document.getElementById('to').addEventListener('change', e=>{ toDi = dayIndexFromISO(e.target.value); render(); });
  cb.addEventListener('change', e=>{ const i=+e.target.dataset.cat; e.target.checked?fCats.add(i):fCats.delete(i); render(); });
  hb.addEventListener('change', e=>{ const i=+e.target.dataset.chan; e.target.checked?fChans.add(i):fChans.delete(i); render(); });
  document.getElementById('reset').addEventListener('click', ()=>{
    fromDi=0; toDi=P.span-1; fCats=new Set(P.cats.map((_,i)=>i)); fChans=new Set(P.chans.map((_,i)=>i));
    document.getElementById('from').value=iso(addDays(0)); document.getElementById('to').value=iso(addDays(P.span-1));
    document.querySelectorAll('#catBox input,#chanBox input').forEach(x=>x.checked=true); render();
  });
}

// aggregate helper: returns rows in [lo,hi] matching category/channel sets
function slice(lo, hi){
  const out=[];
  for(const r of P.recs){
    if(r[0]<lo||r[0]>hi) continue;
    if(!fCats.has(r[1])) continue;
    if(!fChans.has(r[2])) continue;
    out.push(r);
  }
  return out;
}
const sum = (rows, k) => rows.reduce((a,r)=>a+r[k],0);

function kpiBlock(rows, prevRows){
  const rev=sum(rows,4), ord=sum(rows,5), un=sum(rows,6);
  const pr=sum(prevRows,4), po=sum(prevRows,5), pu=sum(prevRows,6);
  const aov = ord? rev/ord : 0, paov = po? pr/po : 0;
  const defs=[
    ["Revenue", money(rev), pr? (rev-pr)/pr*100 : null],
    ["Orders", fmtINR.format(ord), po? (ord-po)/po*100 : null],
    ["Avg order value", money(aov), paov? (aov-paov)/paov*100 : null],
    ["Units sold", fmtINR.format(un), pu? (un-pu)/pu*100 : null],
  ];
  document.getElementById('kpis').innerHTML = defs.map(([lab,val,d])=>{
    let cls='flat', txt='—';
    if(d!==null){ cls = d>0.05?'pos':(d<-0.05?'neg':'flat'); txt=(d>=0?'+':'')+d.toFixed(1)+'% vs prev'; }
    return `<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div><div class="delta ${cls}">${txt}</div></div>`;
  }).join('');
}

function bars(elId, rows, dimIdx, labels){
  const tot={}; labels.forEach((_,i)=>tot[i]=0);
  rows.forEach(r=>{ tot[r[dimIdx]]+=r[4]; });
  const arr=labels.map((name,i)=>[name,tot[i]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...arr.map(x=>x[1]));
  const el=document.getElementById(elId);
  if(!arr.length){ el.innerHTML='<div class="empty">No data for this selection.</div>'; return; }
  el.innerHTML = arr.map(([n,v])=>
    `<div class="barrow"><div class="name">${n}</div><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div><div class="amt">${money(v)}</div></div>`
  ).join('');
}

function trend(rows){
  // weekly revenue over the selected window
  const byWeek={};
  rows.forEach(r=>{ const w=Math.floor(r[0]/7); byWeek[w]=(byWeek[w]||0)+r[4]; });
  const weeks=Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
  const el=document.getElementById('trend');
  if(weeks.length<2){ el.innerHTML='<div class="empty">Not enough range to plot a trend.</div>'; return; }
  const vals=weeks.map(w=>byWeek[w]);
  const W=720,H=240,pad=46, maxV=Math.max(...vals);
  const x=i=> pad + i*(W-pad-12)/(weeks.length-1);
  const y=v=> H-28 - v/maxV*(H-28-14);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${pad},${H-28} ${pts} ${x(weeks.length-1).toFixed(1)},${H-28}`;
  // y gridlines
  let grid='';
  for(let k=0;k<=3;k++){ const gv=maxV*k/3, gy=y(gv);
    grid+=`<line x1="${pad}" y1="${gy}" x2="${W-12}" y2="${gy}" stroke="var(--line)"/>`+
          `<text x="${pad-6}" y="${gy+3}" text-anchor="end" font-size="10" fill="var(--muted)">₹${fmtINR.format(Math.round(gv))}</text>`; }
  const startLbl=iso(addDays(weeks[0]*7)), endLbl=iso(addDays(weeks[weeks.length-1]*7));
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">
    ${grid}
    <polygon points="${area}" fill="var(--accent-soft)" opacity="0.5"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${pad}" y="${H-8}" font-size="10" fill="var(--muted)">${startLbl}</text>
    <text x="${W-12}" y="${H-8}" text-anchor="end" font-size="10" fill="var(--muted)">${endLbl}</text>
  </svg>`;
}

  const legend=arr.map(([n,v,i])=>`<span><i style="background:${CCOLORS[i%6]}"></i>${n} ${(v/grand*100).toFixed(0)}%</span>`).join('');
  el.innerHTML=`<svg viewBox="0 0 180 180" style="max-width:220px;margin:0 auto">${segs}
    <text x="90" y="86" text-anchor="middle" font-size="11" fill="var(--muted)">Total</text>
    <text x="90" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${money(grand)}</text></svg>
    <div class="legend">${legend}</div>`;
}

function matrix(rows){
  // category (rows) x segment (cols) revenue heat table
  const m={}; P.cats.forEach((_,c)=>{ m[c]={}; P.segs.forEach((_,s)=>m[c][s]=0); });
  rows.forEach(r=>{ m[r[1]][r[3]]+=r[4]; });
  let max=1; P.cats.forEach((_,c)=>P.segs.forEach((_,s)=>{ if(m[c][s]>max)max=m[c][s]; }));
  const el=document.getElementById('matrix');
  let head='<tr><th style="text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:4px 6px"></th>'+
    P.segs.map(s=>`<th style="font-size:10px;color:var(--muted);font-weight:600;padding:4px 6px">${s}</th>`).join('')+'</tr>';
  let body='';
  P.cats.forEach((cn,c)=>{ if(!fCats.has(c)) return;
    body+=`<tr><td style="font-size:12px;padding:4px 6px">${cn}</td>`+
      P.segs.map((_,s)=>{ const v=m[c][s]; const a=(v/max*0.85+0.03).toFixed(2);
        return `<td style="padding:4px 6px"><div title="${money(v)}" style="background:rgba(194,24,91,${a});color:${v/max>0.5?'#fff':'var(--ink)'};border-radius:5px;padding:4px 2px;text-align:center;font-size:10px;font-variant-numeric:tabular-nums">${v?('₹'+fmtINR.format(Math.round(v/1000))+'k'):'–'}</div></td>`;
      }).join('')+'</tr>';
  });
  el.innerHTML=`<table style="width:100%;border-collapse:collapse">${head}${body}</table>`;
}

function render(){
  if(toDi<fromDi){ const t=fromDi; fromDi=toDi; toDi=t; }
  const rows=slice(fromDi,toDi);
  const span=toDi-fromDi+1;
  const prevRows=slice(fromDi-span, fromDi-1);
  kpiBlock(rows, prevRows);
  trend(rows);
  bars('catBars', rows, 1, P.cats);
  bars('segBars', rows, 3, P.segs);
  donut(rows);
  matrix(rows);
  const days=span, from=iso(addDays(fromDi)), to=iso(addDays(toDi));
  document.getElementById('foot').textContent =
    `${rows.length?fmtINR.format(sum(rows,5)):0} orders over ${days} days (${from} to ${to}). Synthetic data — portfolio demonstration.`;
}

buildControls();
render();
</script>
</body>
</html>
